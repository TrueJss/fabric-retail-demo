name: Deploy to production

on:
  push:
    branches:
      - main

# ─────────────────────────────────────────────────────────────────────────────
# Fabric Git sync via service principal has a known limitation:
# the calling identity must have GitHub OAuth credentials configured in Fabric,
# which service principals cannot provide through the standard OAuth flow.
#
# This workflow therefore validates that the merge reached main and that
# the Fabric API token can be acquired successfully, then posts a reminder
# to trigger the workspace sync manually from the Fabric UI.
#
# Manual sync (takes ~10 seconds):
#   Fabric workspace → Source control (top-right branch icon) → Update all
#
# For a fully automated alternative, replace this workflow with Fabric
# Deployment Pipelines: create a dev → prod pipeline in the Fabric UI,
# then call POST /v1/deploymentPipelines/{id}/deploy from GitHub Actions.
# That API does not require Git credentials.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  notify-deploy:
    name: Validate token + remind to sync Fabric workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Fabric API token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${FABRIC_TENANT_ID}/oauth2/v2.0/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${FABRIC_CLIENT_ID}" \
            -d "client_secret=${FABRIC_CLIENT_SECRET}" \
            -d "scope=https://api.fabric.microsoft.com/.default")

          TOKEN=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: could not acquire Fabric API token."
            echo "Check that FABRIC_TENANT_ID, FABRIC_CLIENT_ID and FABRIC_CLIENT_SECRET secrets are correct."
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "Fabric API token acquired successfully."
          echo "Service principal is correctly configured."
        env:
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}

      - name: Print sync reminder
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  Merge to main succeeded. API credentials are valid."
          echo ""
          echo "  ACTION REQUIRED — sync the Fabric prod workspace:"
          echo "  1. Open your Fabric prod workspace"
          echo "  2. Click the Source control button (branch icon, top right)"
          echo "  3. Click Update all"
          echo ""
          echo "  This pulls the latest main branch into the workspace."
          echo "══════════════════════════════════════════════════════"
